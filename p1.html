<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMC APP</title>
    <link rel="stylesheet" href="p1.css" />
  </head>
  <body>
    <div class="main">
        <!-- <h1>P1 - IMC APP</h1> -->
      <div class="layout">
        <div class="layout_content">

          <!-- global Card -->
          <div class="calculate_card_height">
            <div class="title_field">
              <h1>Calcul d'IMC</h1>
            </div>

            <!-- champ numéro 1  -->
            <div class="first_field">
              <div class="height_title_field">
                <h2>Votre taille en centimètres</h2>
              </div>
              <div class="input_field_">
                <input />
              </div>
            </div>

            <!-- champ numéro 2  -->
            <div class="last_field">
              <div class="input_field_weight">
                <div class="weight_title_field">
                  <h2>Votre poids en Kg</h2>
                </div>
                <input />
              </div>
            </div>
            <br />

            <!-- button to calculate -->
            <div class="click_for_calculate">
              <button>Calculer un IMC</button>
            </div>

            <!-- show result -->
            <div class="result_field">
              <h2>23.4</h2>
              <h3>Résultat: Bonne santé</h3>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="p1.js"></script>
  </body>
</html>
